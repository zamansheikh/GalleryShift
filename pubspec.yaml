name: gallery_shift
description: "Swipe to clean up your photo gallery."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  shared_preferences: ^2.5.5
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
